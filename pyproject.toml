[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-mvp"
version = "0.1.0"
description = "A small, generic LLM research-agent architecture prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=2.48,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: opt-in tests that may make paid external API calls",
]

[tool.setuptools.packages.find]
where = ["src"]
